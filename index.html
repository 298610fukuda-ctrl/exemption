const rawJan2026 = [
  [1, "排他的論理和(XOR)の相補演算はどれか。", "等価演算|否定論理和|論理積|論理和", 0, "XOR(不一致なら1)の否定は「一致なら1」となる等価演算(XNOR)である。"],
  [2, "0〜9の数字と空白で長さ3の文字列を作る。先頭1文字は数字(空白不可)。2文字目以降は空白可だが、空白の後に数字は不可。何通りか。", "1,110|1,111|1,210|1,331", 0, "数数数(10*10*10=1000)＋数数空(10*10*1=100)＋数空空(10*1*1=10)の合計1110通り。"],
  [3, "入力記号{0,1}のオートマトンで最後が110で終わるものを受理するには、どの状態を受理状態とすればよいか。", "a|b|c|d", 2, "状態遷移図を追うと「1→1→0」と遷移した先の状態がcになるため。"],
  [4, "未知数の個数の3乗に比例する計算。100元連立で2秒。4倍の演算速度のコンピュータで1,000元を計算すると何秒か。", "5|50|500|5,000", 2, "100元→1000元で計算量は10^3=1000倍。速度が4倍なので時間は 1000倍 ÷ 4 = 250倍。2秒 × 250 = 500秒。"],
  [5, "スタック操作の特徴を表す用語はどれか。", "FIFO|LIFO|LILO|LRU", 1, "スタックは後に入れたデータを先に取り出す LIFO (Last In First Out) 構造。"],
  [6, "2分探索において、データの個数が4倍になると、最大探索回数はどうなるか。", "1回増える。|2回増える。|約2倍になる。|約4倍になる。", 1, "2分探索の計算量は O(log2 N)。Nが4倍(2^2)になると、log2(4N) = log2(N) + 2 となり、最大探索回数は2回増える。"],
  [7, "XMLに関する記述のうち、適切なものはどれか。", "HTMLを基にして拡張したもの|専用のエディタが必要|自在にタグを宣言して、文書の属性情報や論理構造を定義することができる。|論理構造と表示スタイルを統合したもの", 2, "XML(eXtensible Markup Language)は、ユーザが独自のタグを定義できるマークアップ言語。"],
  [8, "1件80万ステップ。プロセッサ200MIPS、使用率80%。処理能力(件/秒)は幾らか。", "20|200|250|313", 1, "有効性能は200MIPS×0.8 = 160MIPS(1秒間に1億6千万命令)。1件80万命令なので、160,000,000 ÷ 800,000 = 200件/秒。"],
  [9, "アクセス時間の最も短い記憶装置はどれか。", "CPUの2次キャッシュ|CPUのレジスタ|磁気ディスク|主記憶", 1, "レジスタ ＞ 1次キャッシュ ＞ 2次キャッシュ ＞ 主記憶 ＞ 磁気ディスク の順に高速。"],
  [10, "磁気ディスク装置の性能に関する記述のうち、適切なものはどれか。", "アクセス時間は、回転速度を上げるか位置決め時間を短縮すると短くなる。|前処理と後処理を含む|記憶容量はトラック数だけで決まる|転送速度は回転待ち時間で決まる", 0, "アクセス時間 ＝ シーク時間(位置決め) ＋ サーチ時間(回転待ち) ＋ データ転送時間。"],
  [11, "分散処理システムの「アクセス透過性」の説明はどれか。", "遠隔地にある資源を、手元にある資源と同じ操作で利用できる。|運用管理を個別に行える|データの発生場所で処理できる|一部が故障しても処理が可能", 0, "透過性(Transparency)のうち、ローカル/リモートの違いを意識させないのがアクセス透過性。"],
  [12, "MTBF 3,000時間、MTTR 1,000時間。翌年 MTBFを20%改善、MTTRを10%改善すると稼働率は何%になるか。", "69|73|77|80", 3, "翌年のMTBF = 3000*1.2 = 3600。MTTR = 1000*0.9 = 900。稼働率 = 3600 / (3600+900) = 0.8 (80%)。"],
  [13, "仮想記憶管理のページ入替え方式のうち、最後に使われてからの経過時間が最も長いページを入れ替えるものはどれか。", "FIFO|LFU|LIFO|LRU", 3, "LRU (Least Recently Used) は「最も過去に利用された(長い間使われていない)」ページを追い出す方式。"],
  [14, "コンパイラによる最適化の主な目的はどれか。", "プログラムの実行時間を短縮する。|デバッグを容易にする|保守性を改善する|目的プログラム生成を短縮", 0, "最適化（オプティマイズ）は、無駄な処理を省くなどして、生成されるコードの実行速度やメモリ効率を向上させる。"],
  [15, "Hadoopの説明はどれか。", "JavaEE仕様のAPサーバ|Webサーバ|機能豊富なRDBMS|大規模なデータセットを分散処理するためのソフトウェアライブラリ", 3, "Hadoopはビッグデータなどの大規模データを複数サーバで分散・並列処理(MapReduce等)するミドルウェア。"],
  [16, "1桁の2進数A,Bを加算し、Xに桁上がり、Yに桁上げなしの和を得る論理回路はどれか(半加算器)。", "X=AND, Y=XOR|X=OR, Y=XOR|X=XOR, Y=AND|X=AND, Y=OR", 0, "半加算器の出力は、和(Y)がXOR、桁上がり(X)がAND回路で構成される。"],
  [17, "3次元CGの隠線消去及び隠面消去の説明はどれか。", "光源を解析し色を決定|指定された視点から見える部分だけを描くようにする。|画面に収まる部分だけを表示|半透明表示で内部も生成", 1, "視点から見て、他の物体の後ろに隠れて見えない線(隠線)や面(隠面)を計算して描画しない処理。"],
  [18, "関係データベースのデータ構造の説明はどれか。", "ポインタで結合|タグを用いて構造を表す|データと手続を一体化|データを2次元の表によって表現する。", 3, "関係(リレーショナル)データベースは、行と列からなる「2次元の表（テーブル）」でデータを管理する。"],
  [19, "主キー(a,b)、fはbで特定可能。このレコードを第3正規形にしたものはどれか。", "a,b,c,d,e と b,f に分割|a,b,c,d,e と b,f に分割|a,b,f,c,d,e に統合|a,c,d,e と b,c,d,e に分割", 1, "主キーの一部(b)に従属する属性(f)を切り出す（第2正規化）。残りは(a,b,c,d,e)と(b,f)。"],
  [20, "「中間テスト」表からクラス・教科ごとの平均点を求め、クラス名・教科名の昇順に表示するSQL文のaはどれか。", "GROUP BY クラス名, 教科名 ORDER BY クラス名, AVG(点数)|GROUP BY クラス名, 教科名 ORDER BY クラス名, 教科名|GROUP BY...学生番号|GROUP BY...平均点", 1, "「ごと」なのでGROUP BY クラス名,教科名。「昇順」なので ORDER BY クラス名, 教科名 が正解。"],
  [21, "導出表の説明として、適切なものはどれか。", "実表に依存しない表|実表をコピーした表|何らかの問合せによって得られた表である。|実表の関連", 2, "導出表(ビュー)は、SELECT文などの問合せ結果によって仮想的に作成される表。"],
  [22, "媒体障害の回復において、バックアップをリストアした後に、トランザクションログを用いて行う操作はどれか。", "取得後・コミット前のものをロールバック|取得後・コミット前のものをロールフォワード|取得後にコミットした全トランザクションをロールバック|取得後にコミットした全トランザクションをロールフォワードする。", 3, "リストア後、バックアップ時〜障害発生時までに完了(コミット)した処理をログで再実行(ロールフォワード)し最新化する。"],
  [23, "通信を始める際に、通信相手のIPアドレスを問い合わせる仕組みはどれか。", "ARP|DHCP|DNS|NAT", 2, "DNS(Domain Name System)は、ドメイン名（ホスト名）からIPアドレスを名前解決する仕組み。"],
  [24, "30Mbpsの回線で100秒に1回の1ビット誤り。ビット誤り率は幾らか。", "4.17e-11|3.33e-10|4.17e-5|3.33e-4", 1, "送受信ビット=30*10^6 * 100 = 3*10^9ビット。1回エラーなので 1/(3*10^9) ≒ 3.33 * 10^-10。"],
  [25, "DHCPの説明として、適切なものはどれか。", "IPアドレスの設定を自動化するためのプロトコルである。|ディレクトリサービス用|電子メール転送用|アドレス変換用", 0, "ネットワーク接続時にIPアドレスやサブネットマスクを動的に割り当てる。"],
  [26, "OpenFlowを用いたSDNの説明として、適切なものはどれか。", "MIB情報取得|経路情報を交換|仮想環境での技術|データ転送機能とネットワーク制御機能を論理的に分離し、集中制御を可能とするアーキテクチャ", 3, "SDNは制御(コントロールプレーン)と転送(データプレーン)を分離する。代表的な通信プロトコルがOpenFlow。"],
  [27, "パスワードに使用できる文字数をM、文字数をnとする。パスワードの理論的な総数はどれか。", "M^n|M!|n!/(M-n)!|(M+n-1)!/(n!(M-1)!)", 0, "1文字ごとにM通りの選択肢があり、それがn文字続くので Mのn乗 (M^n) となる。"],
  [28, "共通鍵暗号方式で100人が相互に通信するときに必要な共通鍵の総数は幾つか。", "200|4,950|9,900|10,000", 1, "n(n-1)/2 の公式。100×99 / 2 = 4950個。"],
  [29, "2要素認証に該当する組みはどれか。", "証明書, トークン (両方所持)|静脈, 指紋 (両方生体)|パスワード認証(知識), 静脈認証(生体)|パスワード, 秘密の質問 (両方知識)", 2, "「知識（パスワード等）」「所持（トークン等）」「生体（静脈等）」の異なる2要素を組み合わせる。"],
  [30, "組織的なインシデント対応体制の構築を支援する目的でJPCERT/CCが作成したものはどれか。", "CSIRTマテリアル|ISMSユーザーズガイド|証拠保全ガイドライン|内部不正防止ガイドライン", 0, "組織内CSIRTの構築や運用を支援するための各種テンプレートやガイド文書群。"],
  [31, "マルウェア対策ソフトでのフォールスネガティブ(偽陰性)に該当するものはどれか。", "マルウェアを誤検知する|マルウェアでないものを誤検知する|マルウェアに感染しているのに、感染していないと誤って判定する。|感染していないものを正常と判定する", 2, "フォールスネガティブは「本当は黒（マルウェア）なのに、白（正常）と見逃してしまう」こと。"],
  [32, "ステガノグラフィはどれか。", "画像などのデータの中に秘密の情報を埋め込む。|閲覧者と異なる内容を応答し検索順位を上げる|テストデータを送信し脆弱性を検出する|ゆがんだ文字を認識させ人であることを確認する", 0, "ステガノグラフィは、画像や音声データなどの無害に見えるファイルの中に、秘密のデータを隠し込む技術。"],
  [33, "WAFの説明はどれか。", "Webアプリケーションプログラムへの攻撃を検知し、阻止する。|通信内容の改ざんをPC内で検知する|サーバOSへの不正ログインを阻止する|ファイルへのマルウェア感染を検知する", 0, "WAF(Web Application Firewall)は、Webアプリに特化したファイアウォール。"],
  [34, "E-Rモデルにおけるエンティティの特徴はどれか。", "インスタンスと1対1|物的に実現するもの|特性を表すための属性(アトリビュート)をもつ。|状態遷移として表現", 2, "エンティティ(実体)は、データとして管理する対象であり、その性質を表す「属性(アトリビュート)」をもつ。"],
  [35, "オブジェクト指向において、“自動車”のサブクラスといえるものはどれか。", "エンジン|製造番号|タイヤ|トラック", 3, "トラックは「自動車の一種（is-a関係）」であるため、自動車クラスのサブクラスになる（他はpart-of関係）。"],
  [36, "デザインレビューを実施するねらいとして、適切なものはどれか。", "スケジュールを見直す|仕様の不備や設計の誤りなどを早期に発見し、手戻り工数の削減を図る。|テストを簡略化する|規模見積りの精度向上", 1, "各工程の完了時に設計書等をレビューし、後工程での手戻り（修正コスト）を未然に防ぐのが目的。"],
  [37, "流れ図において、指定の順(④を経由せず⑤へ行き終了等)で実行させるためにmとnに与える初期値aとbの関係はどれか。※設問指定順: ②→③(nが小)→⑤→②→⑥", "a=2b|2a=b|2a=3b|3a=2b", 3, "③で「m < n」となるルート(⑤)を通って次に「m = n」(⑥)で終了するには、初期値が m < n かつ、n-m = m (つまりn=2m)である必要があるが、選択肢と一致しないため、公式解答「エ: 3a=2b」よりユークリッドの互除法的な挙動を逆算。"],
  [38, "ソフトウェア保守のための変更が、影響を受けないはずの箇所に影響を及ぼしていないか確認するテストはどれか。", "運用テスト|結合テスト|システムテスト|リグレッションテスト", 3, "プログラムの修正により、これまでに正常動作していた他の機能が破壊されていないか確認する「退行テスト」。"],
  [39, "アジャイル開発手法のうち、スクラムのものはどれか。", "5つの価値を基礎とし、XP等のプラクティスを推奨|適応的サイクル計画|プロダクトオーナーなどの役割、スプリントレビューなどのイベント、バックログなどの作成物、及びルールから成る。|フィーチャを単位として計画する", 2, "スクラムは「役割(PO,スクラムマスター等)」「イベント(スプリント等)」「作成物(バックログ等)」で構成されるフレームワーク。"],
  [40, "ソフトウェアのリファクタリングの説明はどれか。", "外部から見た振る舞いを変更せずに保守性が高いプログラムに書き直す。|設計書を再作成する|部品を組み合わせて開発する|修正が影響していないかテストする", 0, "内部構造（コードの可読性や設計）を綺麗に整理・改善する作業。"],

let currentExam = 'june';
const state = {
  june: { answered: new Set(), correct: 0, data: rawJune },
  july: { answered: new Set(), correct: 0, data: rawJuly },
  jan: { answered: new Set(), correct: 0, data: rawJan2026 },
  jul2025: { answered: new Set(), correct: 0, data: rawJul2025 },
  dec2025: { answered: new Set(), correct: 0, data: rawDec2025 },
  jun2025: { answered: new Set(), correct: 0, data: rawJun2025 }
};

function switchExam(examKey) {
  currentExam = examKey;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`tab-${examKey}`).classList.add('active');
  renderQuiz();
}

function renderQuiz() {
  const container = document.getElementById('quiz-list');
  container.innerHTML = '';
  const currentData = state[currentExam].data;
  const currentState = state[currentExam];
document.getElementById('total-count').innerText = currentData.length;
  updateScore();

  currentData.forEach(qData => {
    const [qId, qBody, qOptsStr, qAnsIdx, qExp] = qData;
    const opts = qOptsStr.split('|');
    const tags = ['ア', 'イ', 'ウ', 'エ'];
    
    const card = document.createElement('div');
    card.className = 'q-box';
    
    let optsHtml = '';
    opts.forEach((optText, i) => {
      let btnClass = 'opt-item' + (currentState.answered.has(qId) ? ' disabled' : '');
      let isAns = (i === qAnsIdx);
      if (currentState.answered.has(qId)) {
        if (isAns) btnClass += ' correct';
        else btnClass += ' wrong';
      }
      
      optsHtml += `
        <div class="${btnClass}" onclick="onSelect(${qId}, ${i})" id="opt-${currentExam}-${qId}-${i}">
          <span class="opt-tag">${tags[i]}</span>
          <span>${optText}</span>
        </div>
      `;
    });
    
    card.innerHTML = `
      <div class="q-num">問 ${qId}</div>
      <div class="q-body">${qBody}</div>
      <div>${optsHtml}</div>
      <div class="exp-section" id="exp-${currentExam}-${qId}"></div>
    `;
    container.appendChild(card);
    
    if (currentState.answered.has(qId)) {
      showExplanation(qId, qAnsIdx, qAnsIdx, qExp, tags[qAnsIdx]); // Just reshows correct if answered
    }
  });
}

function onSelect(qId, pickedIdx) {
  const currentState = state[currentExam];
  if (currentState.answered.has(qId)) return;
  currentState.answered.add(qId);
  
  const qData = currentState.data.find(item => item[0] === qId);
  const qAnsIdx = qData[3];
  const isRight = (pickedIdx === qAnsIdx);
  if (isRight) currentState.correct++;
  
  updateScore();

  const tags = ['ア', 'イ', 'ウ', 'エ'];
  qData[2].split('|').forEach((_, i) => {
    const el = document.getElementById(`opt-${currentExam}-${qId}-${i}`);
    el.classList.add('disabled');
    if (i === qAnsIdx) el.classList.add('correct');
    else if (i === pickedIdx && !isRight) el.classList.add('wrong');
  });

  showExplanation(qId, pickedIdx, qAnsIdx, qData[4], tags[qAnsIdx]);
}

function showExplanation(qId, pickedIdx, qAnsIdx, exp, ansTag) {
  const isRight = (pickedIdx === qAnsIdx);
  const expBox = document.getElementById(`exp-${currentExam}-${qId}`);
  expBox.className = `exp-section show ${isRight ? 'is-correct' : 'is-wrong'}`;
  expBox.innerHTML = `
    <div class="exp-header" style="color:${isRight ? '#16a34a' : '#dc2626'}">
      ${isRight ? '⭕ 正解！' : '❌ 不正解…'}（正解：${ansTag}）
    </div>
    <div>${exp}</div>
  `;
}

function updateScore() {
  document.getElementById('done-count').innerText = state[currentExam].answered.size;
  document.getElementById('right-count').innerText = state[currentExam].correct;
}

function resetCurrentExam() {
  state[currentExam].answered.clear();
  state[currentExam].correct = 0;
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = renderQuiz;
</script>
