  .btn-reset:hover { background: #e2e8f0; }

  .q-body { margin-bottom: 20px; white-space: pre-wrap; font-size: 0.98rem; }

  .opt-item.correct { background: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: var(--correct-text) !important; font-weight: bold; }
  .opt-item.wrong { background: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: var(--wrong-text) !important; }

  .exp-section.show { display: block; }

  .is-wrong { background: #fef2f2; border-left: 5px solid var(--wrong-border); }

let currentExam = 'june';
const state = {
  june: { answered: new Set(), correct: 0, data: rawJune },
  july: { answered: new Set(), correct: 0, data: rawJuly },
  jan: { answered: new Set(), correct: 0, data: rawJan }
};

function switchExam(examKey) {
  currentExam = examKey;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`tab-${examKey}`).classList.add('active');
  renderQuiz();
}

function renderQuiz() {
  const container = document.getElementById('quiz-list');
  container.innerHTML = '';
  const currentData = state[currentExam].data;
  const currentState = state[currentExam];
document.getElementById('total-count').innerText = currentData.length;
  updateScore();

  currentData.forEach(qData => {
    const [qId, qBody, qOptsStr, qAnsIdx, qExp] = qData;
    const opts = qOptsStr.split('|');
    const tags = ['ア', 'イ', 'ウ', 'エ'];
    
    const card = document.createElement('div');
    card.className = 'q-box';
    
    let optsHtml = '';
    opts.forEach((optText, i) => {
      let btnClass = 'opt-item' + (currentState.answered.has(qId) ? ' disabled' : '');
      let isAns = (i === qAnsIdx);
      if (currentState.answered.has(qId)) {
        if (isAns) btnClass += ' correct';
        else btnClass += ' wrong';
      }
      
      optsHtml += `
        <div class="${btnClass}" onclick="onSelect(${qId}, ${i})" id="opt-${currentExam}-${qId}-${i}">
          <span class="opt-tag">${tags[i]}</span>
          <span>${optText}</span>
        </div>
      `;
    });
    
    card.innerHTML = `
      <div class="q-num">問 ${qId}</div>
      <div class="q-body">${qBody}</div>
      <div>${optsHtml}</div>
      <div class="exp-section" id="exp-${currentExam}-${qId}"></div>
    `;
    container.appendChild(card);
    
    if (currentState.answered.has(qId)) {
      showExplanation(qId, qAnsIdx, qAnsIdx, qExp, tags[qAnsIdx]); // Just reshows correct if answered
    }
  });
}

function onSelect(qId, pickedIdx) {
  const currentState = state[currentExam];
  if (currentState.answered.has(qId)) return;
  currentState.answered.add(qId);
  
  const qData = currentState.data.find(item => item[0] === qId);
  const qAnsIdx = qData[3];
  const isRight = (pickedIdx === qAnsIdx);
  if (isRight) currentState.correct++;
  
  updateScore();

  const tags = ['ア', 'イ', 'ウ', 'エ'];
  qData[2].split('|').forEach((_, i) => {
    const el = document.getElementById(`opt-${currentExam}-${qId}-${i}`);
    el.classList.add('disabled');
    if (i === qAnsIdx) el.classList.add('correct');
    else if (i === pickedIdx && !isRight) el.classList.add('wrong');
  });

  showExplanation(qId, pickedIdx, qAnsIdx, qData[4], tags[qAnsIdx]);
}

function showExplanation(qId, pickedIdx, qAnsIdx, exp, ansTag) {
  const isRight = (pickedIdx === qAnsIdx);
  const expBox = document.getElementById(`exp-${currentExam}-${qId}`);
  expBox.className = `exp-section show ${isRight ? 'is-correct' : 'is-wrong'}`;
  expBox.innerHTML = `
    <div class="exp-header" style="color:${isRight ? '#16a34a' : '#dc2626'}">
      ${isRight ? '⭕ 正解！' : '❌ 不正解…'}（正解：${ansTag}）
    </div>
    <div>${exp}</div>
  `;
}

function updateScore() {
  document.getElementById('done-count').innerText = state[currentExam].answered.size;
  document.getElementById('right-count').innerText = state[currentExam].correct;
}

function resetCurrentExam() {
  state[currentExam].answered.clear();
  state[currentExam].correct = 0;
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = renderQuiz;
</script>
</body>
</html>
